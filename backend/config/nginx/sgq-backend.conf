server {
    listen 8443 ssl;
    server_name sistemi.fr-busato.it;
    ssl_certificate /etc/letsencrypt/live/sistemi.fr-busato.it/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sistemi.fr-busato.it/privkey.pem; # managed by Certbot

    # WebDAV: Office non e' un browser, NON intercettare OPTIONS
    location /webdav/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100m;
        # Ingest/upload norme: 7–20 PDF + pause IA-16 (2s/file, embed, retry TPM) possono superare 5 min.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # === AMBIENTE TEST: /test-api/ -> Node.js porta 3001 (DB: 2026-06-18_SGQ_ISO9001) ===
    location /test-api/ {
        set $sgq_preflight_ok 0;
        if ($request_method = OPTIONS) {
            set $sgq_preflight_ok 1;
        }
        if ($sgq_cors_allow_origin = "") {
            set $sgq_preflight_ok 0;
        }
        if ($sgq_preflight_ok = 1) {
            add_header 'Access-Control-Allow-Origin' $sgq_cors_allow_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,PATCH,DELETE,OPTIONS,PROPFIND,LOCK,UNLOCK' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization,X-Audit-Lock-Token' always;
            add_header 'Access-Control-Max-Age' '3600' always;
            return 204;
        }

        # Strip /test-api/ con lo slash finale di proxy_pass.
        # Non usare rewrite+break nello stesso location degli `if` OPTIONS:
        # dopo nginx 1.24.0-2ubuntu7.16 (unattended-upgrade 20/08/2026 06:32)
        # l'URI non veniva più riscritto e Node riceveva /test-api/api/v1/health → 404.
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        # Ingest/upload norme: 7–20 PDF + pause IA-16 (2s/file, embed, retry TPM) possono superare 5 min.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 100m;

        proxy_intercept_errors on;
        error_page 502 504 = @backend_test_down;
    }

    location @backend_test_down {
        add_header 'Access-Control-Allow-Origin' $sgq_cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        default_type 'application/json';
        return 503 '{"error":"Server TEST temporaneamente non disponibile.","code":"BACKEND_UNAVAILABLE"}';
    }

    location / {
        # CORS preflight OPTIONS: nginx (sopravvive al restart Node) + whitelist dinamica
        set $sgq_preflight_ok 0;
        if ($request_method = OPTIONS) {
            set $sgq_preflight_ok 1;
        }
        if ($sgq_cors_allow_origin = "") {
            set $sgq_preflight_ok 0;
        }
        if ($sgq_preflight_ok = 1) {
            add_header 'Access-Control-Allow-Origin' $sgq_cors_allow_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,PATCH,DELETE,OPTIONS,PROPFIND,LOCK,UNLOCK' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization,X-Audit-Lock-Token' always;
            add_header 'Access-Control-Max-Age' '3600' always;
            return 204;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        # Ingest/upload norme: 7–20 PDF + pause IA-16 (2s/file, embed, retry TPM) possono superare 5 min.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 100m;

        proxy_intercept_errors on;
        error_page 502 504 = @backend_down;
    }

    location @backend_down {
        add_header 'Access-Control-Allow-Origin' $sgq_cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        default_type 'application/json';
        return 503 '{"error":"Server temporaneamente non disponibile. Riprovare tra pochi secondi.","code":"BACKEND_UNAVAILABLE"}';
    }
}
