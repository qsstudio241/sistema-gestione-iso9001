# SGQ — map CORS (http context, include da conf.d)
# Whitelist: origini statiche + pattern Netlify Deploy Preview / branch (systemgest)
map $http_origin $sgq_cors_allow_origin {
    default "";
    "https://systemgest.netlify.app" $http_origin;
    "https://busato.selfip.com" $http_origin;
    ~^https://deploy-preview-[0-9]+--systemgest\.netlify\.app$ $http_origin;
    ~^https://[a-z0-9][a-z0-9-]*--systemgest\.netlify\.app$ $http_origin;
}
