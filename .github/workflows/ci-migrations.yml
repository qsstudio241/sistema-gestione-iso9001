# Contratto file migrazioni (required) + apply da 169 su SQL Server vuoto.
# Lo storico < 169 non ha baseline: lo script lo salta e resta verde (gap noto).
# Rosso solo se una 169+ o il suo verify fallisce. Niente continue-on-error:
# GitHub altrimenti marca il check failed e sveglia Eventi. Issue #699.
# Dettaglio: docs/reference/DATABASE.md § Apply-on-empty.
name: CI migrazioni

on:
  pull_request:
    branches:
      - main
    paths:
      - 'database/migrations/**'
      - 'backend/scripts/migrationContract.js'
      - 'backend/scripts/migrationHeaderContract.test.js'
      - 'backend/scripts/migrationNumberUniqueness.test.js'
      - 'backend/scripts/apply-migrations-ci.js'
      - '.github/workflows/ci-migrations.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**'
      - 'backend/scripts/migrationContract.js'
      - 'backend/scripts/migrationHeaderContract.test.js'
      - 'backend/scripts/migrationNumberUniqueness.test.js'
      - 'backend/scripts/apply-migrations-ci.js'
      - '.github/workflows/ci-migrations.yml'
  workflow_dispatch:

jobs:
  migration-contract:
    name: Contratto intestazione + numerazione (L1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dipendenze backend
        working-directory: backend
        run: npm ci

      - name: Test L1 contratto e unicità numeri
        working-directory: backend
        run: >
          npx jest
          scripts/migrationNumberUniqueness.test.js
          scripts/migrationHeaderContract.test.js
          --coverage=false

  migration-apply-empty-db:
    name: Apply da 169 su SQL Server vuoto
    runs-on: ubuntu-latest
    # Verde se resta solo il gap pre-169; rosso solo su regressione 169+.
    # Senza continue-on-error: un FAIL onesto non deve mascherarsi da check rosso "atteso".
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SgqCi_Mig2026!Aa
        ports:
          - 1433:1433
        options: >-
          --health-cmd="echo >&2"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dipendenze backend
        working-directory: backend
        run: npm ci

      - name: Attendi SQL Server
        working-directory: backend
        env:
          DB_SERVER: localhost
          DB_PORT: '1433'
          DB_USER: sa
          DB_PASSWORD: SgqCi_Mig2026!Aa
          DB_DATABASE: master
        run: |
          node -e "
          const sql = require('mssql');
          const cfg = {
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            server: process.env.DB_SERVER,
            port: Number(process.env.DB_PORT),
            database: 'master',
            options: { encrypt: true, trustServerCertificate: true },
            connectionTimeout: 5000
          };
          (async () => {
            for (let i = 1; i <= 40; i++) {
              try {
                const p = await sql.connect(cfg);
                await p.request().query('SELECT 1 AS ok');
                await p.close();
                console.log('SQL Server pronto al tentativo', i);
                process.exit(0);
              } catch (e) {
                console.log('attesa', i, e.message);
                await new Promise((r) => setTimeout(r, 3000));
              }
            }
            console.error('SQL Server non risponde');
            process.exit(1);
          })();
          "

      - name: Applica migrazioni + seed + verify
        working-directory: .
        env:
          DB_SERVER: localhost
          DB_PORT: '1433'
          DB_USER: sa
          DB_PASSWORD: SgqCi_Mig2026!Aa
          DB_DATABASE: SGQ_ISO9001
        run: node backend/scripts/apply-migrations-ci.js

      - name: Annota esito
        if: always()
        run: |
          echo "## Apply-on-empty (da 169)" >> "$GITHUB_STEP_SUMMARY"
          echo "Lo storico **< 169** non si applica su SQL vuoto (nessuna baseline)." >> "$GITHUB_STEP_SUMMARY"
          echo "Il job è **verde** se non ci sono 169+ (skip apply/seed/verify) oppure se apply + seed + verify da 169 passano." >> "$GITHUB_STEP_SUMMARY"
          echo "È **rosso** solo se una 169+ o il suo \`NNN_verify.sql\` fallisce (regressione reale)." >> "$GITHUB_STEP_SUMMARY"
          echo "Issue https://github.com/qsstudio241/sistema-gestione-iso9001/issues/699" >> "$GITHUB_STEP_SUMMARY"
