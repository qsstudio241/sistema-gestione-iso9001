# Smoke test remoto sul DB di test via backend VPS.
# NON richiede accesso diretto a SQL Server: chiama l'endpoint HTTPS del backend
# che esegue le verifiche internamente con una connessione isolata al profilo "test".
#
# Segreti GitHub richiesti (Settings → Secrets and variables → Actions):
#   SMOKE_TOKEN     — token segreto da impostare anche nel .env del VPS
# Endpoint host hardcoded (non è un segreto): sistemi.fr-busato.it:8443
# Aggiornato: 31/07/2026 — host VPS rinominato; endpoint non più da secret stale

name: Smoke test DB test

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/smoke-test.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'backend/**'
      - 'app/**'
      - 'docs/**'
      - '.github/workflows/smoke-test.yml'
      - '.cursor/**'
  # Esecuzione manuale (utile per debug)
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test DB test (via backend VPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Esegui smoke-remote
        run: node backend/scripts/smoke-remote.js
        env:
          # Host non è un segreto: evita CI rossa se secrets.SMOKE_ENDPOINT è stale
          SMOKE_ENDPOINT: sistemi.fr-busato.it:8443
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        # 4 tentativi × 30s timeout socket + backoff 2+4+8s ≈ 2.5 min worst-case
        timeout-minutes: 4

      - name: Health check backend test (test-api)
        run: |
          URL="https://sistemi.fr-busato.it:8443/test-api/api/v1/health"
          CODE=$(curl -sk -o /tmp/sgq_test_health.json -w '%{http_code}' --max-time 15 "$URL")
          echo "HTTP ${CODE}"
          cat /tmp/sgq_test_health.json || true
          echo
          if [ "${CODE}" != "200" ]; then
            echo "HEALTH CHECK FAIL: ${URL} → HTTP ${CODE} (atteso 200)."
            echo "Se Node TEST su :3001 risponde su /api/v1/health, nginx non sta strippando /test-api/."
            exit 1
          fi
          grep -q '"status":"healthy"' /tmp/sgq_test_health.json \
            || { echo "HEALTH CHECK FAIL: HTTP 200 ma body non healthy"; exit 1; }
        timeout-minutes: 1
